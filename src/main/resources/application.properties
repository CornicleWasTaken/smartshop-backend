spring.application.name=simpleshop
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/${DB_NAME:XEPDB1}
spring.datasource.username=shop_user
spring.datasource.password=shop123
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
server.port=8087

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:change-me-change-me-change-me-change-me-please-32bytes}
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000